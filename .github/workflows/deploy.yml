name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Actions Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"
          cache: npm
      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: |
          mkdir -p .quartz/plugins

          git clone --depth=1 \
          https://github.com/quartz-community/og-image.git \
          .quartz/plugins/og-image

          git clone --depth=1 \
          https://github.com/quartz-community/obsidian-plugin-excalidraw.git \
          .quartz/plugins/obsidian-plugin-excalidraw

          cat > .quartz/plugins/index.ts <<'EOF'
          export { CustomOgImagesEmitterName } from "./og-image/src/emitter"
          EOF

         npm install satori sharp reading-time

      - name: Check Quartz Plugins
        run: |
          ls -la .quartz/plugins

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public


  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4